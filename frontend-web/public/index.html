<!DOCTYPE html>
<!--
  ReactiQuiz Frontend Application Entry Point
  
  This HTML file serves as the entry point for the ReactiQuiz React application.
  It includes:
  - Meta tags for SEO, Open Graph, and Twitter Card support
  - AdSense verification script
  - Root div where the React app will be mounted
  - Manifest link for PWA support
  
  The React app is initialized in src/index.tsx and mounted to the #root div.
-->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="ReactiQuiz - AI-powered educational quiz platform for students. Practice quizzes, competitive exam preparation, and knowledge assessment across multiple subjects." />
  <meta name="keywords" content="quiz, education, learning, students, competitive exams, practice tests, knowledge assessment, AI-powered quizzes" />
  <meta name="author" content="ReactiQuiz Team" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="ReactiQuiz - AI-Powered Educational Quiz Platform" />
  <meta property="og:description" content="Practice quizzes, competitive exam preparation, and knowledge assessment across multiple subjects with our AI-powered platform." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://reactiquiz.web.app" />
  <meta property="og:image" content="https://reactiquiz.web.app/logo.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ReactiQuiz - AI-Powered Educational Quiz Platform" />
  <meta name="twitter:description" content="Practice quizzes, competitive exam preparation, and knowledge assessment across multiple subjects." />
  <meta name="twitter:image" content="https://reactiquiz.web.app/logo.png" />

  <link rel="icon" href="%PUBLIC_URL%/logo.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- AdSense verification code -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7334752393266414"
  crossorigin="anonymous"></script>

  <title>ReactiQuiz</title>
</head>

<body style="background-color:#0A0A0A; color:#F5F7FA;">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
